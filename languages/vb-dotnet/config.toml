name = "VB.NET"
grammar = "vb_dotnet"
path_suffixes = ["vb"]
line_comments = ["' "]
tab_size = 4
hard_tabs = true
autoclose_before = ",)]}"

brackets = [
	{ start = "(", end = ")", close = true, newline = false },
	{ start = "[", end = "]", close = true, newline = false },
	{ start = "{", end = "}", close = true, newline = false },
	{ start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
